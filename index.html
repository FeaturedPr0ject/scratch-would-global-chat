<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffad00">
<title>SWG Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body><script src="auth-gate.js"></script>
<div class="app-shell">
<header class="topbar">
<a class="brand" href="./" aria-label="SWG Chat">
<img class="logo-image" src="./assests/logo.png" alt="SWG">
<span>SWG Chat</span>
</a>
<div class="top-actions">
<span id="connectionDot" class="status-dot offline"></span>
<span id="connectionText">Signed out</span>
</div>
</header>

<main class="chat-layout">
<aside class="sidebar">
<div class="profile-card">
<div class="avatar" id="profileAvatar">?</div>
<div>
<strong id="profileName">Guest</strong>
<span>Global member</span>
</div>
<button id="changeName" class="icon-button" type="button" aria-label="Change username">✎</button>
</div>
<div class="server-card">
<img class="logo-image mini-logo-image" src="./assests/logo.png" alt="SWG">
<div>
<strong>Global</strong>
<span>Everyone can chat</span>
</div>
</div>
<div class="sidebar-note">
<strong>Be nice.</strong>
<span>Keep the global chat friendly and safe.</span>
</div>
</aside>

<section class="chat-panel">
<div class="chat-head">
<div>
<h1>SWG Chat</h1>
<p id="roomStatus">Public room</p>
</div>
<div class="head-pill">GLOBAL</div>
</div>

<div id="messages" class="messages" aria-live="polite"></div>

<div class="composer">
<div class="composer-row">
<textarea id="messageInput" maxlength="500" rows="1" placeholder="Send a message..." aria-label="Message"></textarea>
<button id="sendButton" class="send-button" type="button">Send</button>
</div>
<div class="composer-foot">
<span id="charCount">0 / 500</span>
<span>Enter to send · Shift+Enter for a new line</span>
</div>
</div>
</section>
</main>
</div>
<div id="nameModal" class="modal hidden">
<div class="modal-card">
<div class="modal-logo"><img class="logo-image" src="./assests/logo.png" alt="SWG"></div>
<h2>Choose your name</h2>
<p>Pick a username for SWG Chat.</p>
<input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="Username">
<button id="saveName" class="primary-button" type="button">Join Chat</button>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
