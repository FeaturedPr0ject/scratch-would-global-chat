<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffad00">
<title>SWGC Room Chats — Troubleshoot</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="troubleshoot.css">
</head>
<body class="troubleshoot-page">
<main class="troubleshoot-shell">
<section class="troubleshoot-card">
<a class="back-link" href="./">← Back to SWGC Room Chats</a>
<div class="troubleshoot-logo"><img class="logo-image" src="./assests/logo.png" alt="SWG"></div>
<div class="troubleshoot-title">
<h1>Troubleshoot</h1>
<p>Tell us what went wrong and send a support request.</p>
</div>
<form id="troubleshootForm" class="troubleshoot-form">
<label for="reasonInput">Reason</label>
<select id="reasonInput" name="reason" required>
<option value="">Select a reason</option>
<option value="Account or login">Account or login</option>
<option value="Messages or chat">Messages or chat</option>
<option value="Website or UI">Website or UI</option>
<option value="Security or CAPTCHA">Security or CAPTCHA</option>
<option value="Performance">Performance</option>
<option value="Other">Other</option>
</select>

<div id="otherReasonWrap" class="other-reason hidden">
<label for="otherReasonInput">Other reason</label>
<textarea id="otherReasonInput" name="otherReason" maxlength="1000" rows="7" placeholder="Write your reason here..."></textarea>
</div>

<label for="detailsInput">Details</label>
<textarea id="detailsInput" name="details" maxlength="5000" rows="8" placeholder="Describe the problem, what you expected, and what happened." required></textarea>

<p class="support-destination">Support requests are sent to the SWGC support mailbox.</p>
<p id="requestMessage" class="request-message" aria-live="polite"></p>
<button class="primary-button" type="submit">Send Support Request</button>
</form>
</section>
</main>
<script type="module" src="troubleshoot.js"></script>
</body>
</html>
