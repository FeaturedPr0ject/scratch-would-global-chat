name: Build SWGC Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: |
          VERSION_NAME="${GITHUB_REF_TYPE}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION_NAME="${GITHUB_REF_NAME}"; else VERSION_NAME="1.0.0-build.${GITHUB_RUN_NUMBER}"; fi
          gradle --no-daemon assembleDebug -PappVersionCode="${GITHUB_RUN_NUMBER}" -PappVersionName="${VERSION_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWGC-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SWGC Android ${{ github.ref_name }}
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
