name: Build SWGC Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set version metadata
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="$GITHUB_REF_NAME"
          else
            VERSION_NAME="1.0.0-build.$GITHUB_RUN_NUMBER"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug -PappVersionCode="${GITHUB_RUN_NUMBER}" -PappVersionName="${{ steps.version.outputs.version_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWGC-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_name }}
          name: SWGC Android ${{ steps.version.outputs.version_name }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      - name: Checkout update manifest branch
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          ref: main
          path: update-manifest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Android download manifest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          jq -n --arg version "$VERSION_NAME" --arg code "$VERSION_CODE" --arg apk "https://github.com/FeaturedPr0ject/scratch-would-global-chat/releases/download/$VERSION_NAME/app-debug.apk" '{version:$version,version_code:($code|tonumber),apk_url:$apk,channel:"stable",updated_at:(now|todate)}' > update-manifest/android-updates/manifest.json
          git -C update-manifest config user.name "github-actions[bot]"
          git -C update-manifest config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C update-manifest add android-updates/manifest.json
          if ! git -C update-manifest diff --cached --quiet; then
            git -C update-manifest commit -m "Update Android download manifest"
            git -C update-manifest push origin HEAD:main
          fi
