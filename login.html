<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffad00">
<title>SWG Chat — Login</title>
<link rel="stylesheet" href="style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="auth-page">
<main class="auth-shell">
<section class="auth-card">
<div class="auth-logo">
<svg viewBox="0 0 240 120" aria-hidden="true">
<path d="M30 62C8 42 23 10 55 16C72-1 101 6 111 23C128 2 165 8 170 31C203 12 226 36 211 61C233 82 213 111 182 101C166 121 134 116 122 96C103 118 69 113 65 91C35 103 12 85 30 62Z" fill="#ffad00" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
<text x="120" y="73" text-anchor="middle" fill="#fff" font-size="58" font-weight="900" font-family="Arial Black,Arial,sans-serif">SWG</text>
</svg>
</div>
<div class="auth-title">
<h1>SWG Chat</h1>
<p>Sign in to keep your identity connected to your account.</p>
</div>
<form id="loginForm" class="auth-form">
<label for="emailInput">Email</label>
<input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="passwordInput">Password</label>
<input id="passwordInput" type="password" autocomplete="current-password" required placeholder="Password">
<div class="turnstile-wrap">
<div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY" data-theme="dark"></div>
</div>
<p id="authMessage" class="auth-message"></p>
<button class="primary-button" type="submit">Sign In</button>
</form>
<div class="auth-foot">
<span>Session expires after 2 days.</span>
<a href="./">Back to SWG Chat</a>
</div>
</section>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
