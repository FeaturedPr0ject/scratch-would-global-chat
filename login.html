<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffad00">
<title>SWG Chat — Login</title>
<link rel="stylesheet" href="style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="auth-page">
<main class="auth-shell">
<section class="auth-card">
<div class="auth-logo"><img class="logo-image" src="./assests/logo.png" alt="SWG"></div>
<div class="auth-title">
<h1>Đăng nhập / Log In</h1>
<p>Sign in to keep your SWG Chat identity connected to your account.</p>
</div>
<form id="loginForm" class="auth-form">
<label for="emailInput">Email</label>
<input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="passwordInput">Password</label>
<input id="passwordInput" type="password" autocomplete="current-password" required placeholder="Password">
<div class="turnstile-wrap">
<div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY" data-theme="dark"></div>
</div>
<p id="authMessage" class="auth-message"></p>
<button class="primary-button" type="submit">Đăng nhập / Log In</button>
</form>
<div class="auth-foot">
<span>Session expires after 2 days.</span>
<a href="./">Back to SWG Chat</a>
</div>
</section>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
